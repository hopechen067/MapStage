display_name: "MapStage"
default_prompt: |
  Use the mapstage skill to build frame-exact narrative map shots for history
  videos on MapLibre GL JS 5.6. Three layers: Look (preset.json v3 exported from
  the studio), Story (story.json v1: sites, routes with side/role/draw, label
  beats normal/active/dim, shots fitted to the 16:9 safe area, cards), Stage
  (window.__mapstageSeek(t) resolving after map idle). Defaults are compliant
  for Chinese video platforms: no province/national borders, no fog, no
  vignette, Taiwan/Hainan/South China Sea islands complete on full maps. One
  purposeful camera move per narration line; jumpTo + idle only (no
  easeTo/flyTo in recording); precache all viewports before recording. Raster
  DEM must use encoding terrarium. Never use the studio (tuner/) as the final
  render host. Stop at a 960x540 preview for user approval before the 1080p
  final. Follow references/*.md for specs.
