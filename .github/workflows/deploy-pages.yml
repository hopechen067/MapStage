# Deploy the MapStage site (home, docs, examples, /studio/ tuner) to GitHub Pages.
# Live URL: https://<owner>.github.io/<repo>/
# The site is built by mapstage/site/build.mjs (same layout as site/serve.mjs);
# its licence gate refuses to build if non-redistributable data is present.
name: Deploy site (GitHub Pages)

on:
  push:
    branches: [master, main]
    paths:
      - "mapstage/**"
      - "showcases/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build site
        run: |
          set -euo pipefail
          node mapstage/site/build.mjs _site
          touch _site/.nojekyll
          date -u +"%Y-%m-%dT%H:%M:%SZ" > _site/DEPLOYED_AT.txt
          # Public Pages must never redistribute hydrography or local tile config.
          leftover=$(find _site -type f \( -name 'water-data.js' -o -name 'water-manifest.json' -o -name 'water-pack.json' -o -name '*.local.js' \) -print)
          if [ -n "${leftover}" ]; then
            echo "::error::Public Pages must not publish these files:"
            echo "${leftover}"
            exit 1
          fi
          echo "OK  no water overlay / local config files in publish tree"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
