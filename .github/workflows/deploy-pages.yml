# Deploy the MapStage tuner as a static site on GitHub Pages.
# Live URL: https://<owner>.github.io/<repo>/
name: Deploy tuner (GitHub Pages)

on:
  push:
    branches: [master, main]
    paths:
      - "mapstage/tuner/**"
      - "showcases/hexi-ep07/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site root
        run: |
          set -euo pipefail
          mkdir -p _site
          # Publish only the tuner static assets (relative paths stay valid)
          rsync -a \
            --exclude '_serve.*' \
            --exclude '_preview*' \
            --exclude 'verify.mjs' \
            --exclude 'map-tiles.config.local.js' \
            --exclude '.DS_Store' \
            --exclude 'assets/water-data.js' \
            --exclude 'assets/water-manifest.json' \
            --exclude 'water-data.js' \
            --exclude 'water-manifest.json' \
            mapstage/tuner/ _site/
          # Demo clip for README / site embed (served as video/mp4, not raw attachment)
          mkdir -p _site/media
          if [ -f showcases/hexi-ep07/hexi-ep07-demo-480p.mp4 ]; then
            cp -f showcases/hexi-ep07/hexi-ep07-demo-480p.mp4 _site/media/
          fi
          # Prevent Jekyll from ignoring underscore paths
          touch _site/.nojekyll
          # Small marker for debugging deploys
          date -u +"%Y-%m-%dT%H:%M:%SZ" > _site/DEPLOYED_AT.txt
          # Public repo + GitHub Pages must never redistribute hydrography.
          # Exclude, delete, then fail the job if water-data.js / water-manifest.json
          # are still in the artifact (do not validate-and-publish them).
          rm -f _site/assets/water-data.js _site/assets/water-manifest.json
          find _site -type f \( -name 'water-data.js' -o -name 'water-manifest.json' \) -print -delete
          python3 -c '
          import json
          from pathlib import Path
          p = Path("_site/assets/water-pack.json")
          if not p.is_file():
              raise SystemExit("missing _site/assets/water-pack.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          data["enabled"] = False
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          check = json.loads(p.read_text(encoding="utf-8"))
          if check.get("enabled") is not False:
              raise SystemExit("water-pack.json enabled must be false")
          print("OK  water-pack.json forced enabled=false")
          '
          leftover=$(find _site -type f \( -name 'water-data.js' -o -name 'water-manifest.json' \) -print)
          if [ -n "${leftover}" ]; then
            echo "::error::Public Pages must not publish water overlay files:"
            echo "${leftover}"
            exit 1
          fi
          echo "OK  no water-data.js / water-manifest.json in publish tree"
          ls -la _site _site/assets _site/media | head -60

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
